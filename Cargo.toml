[package]
name="language-engine-witness"
version="0.14.1"
edition="2024"
rust-version="1.89"
license="MIT OR Apache-2.0"
repository="https://github.com/LiGoldragon/language-engine-witness"
description="Process-level acceptance witness for the minimal language engine"
[dependencies]
nomos-engine={git="https://github.com/LiGoldragon/nomos-engine.git",rev="0773e03eae899e1364cb639280e57520d6d454b2"}
signal-nomos={git="https://github.com/LiGoldragon/signal-nomos.git",rev="40ea24045194542a679b97ae34e53c92c2393480"}
rkyv={version="0.8",features=["bytecheck"]}
[dev-dependencies]
tempfile="3"
slice-core-ethos={package="core-ethos",git="https://github.com/LiGoldragon/core-ethos.git",rev="47c866f101c0e830ecff70451e92f7bdc0ade4e7"}
slice-core-logos={package="core-logos",git="https://github.com/LiGoldragon/core-logos.git",rev="141abe23273273d2e4470ce15b42ccf9bc5c8764"}
slice-core-nomos={package="core-nomos",git="https://github.com/LiGoldragon/core-nomos.git",rev="d47e1e4441b7110051aba0f54eb6dea31c057b4c"}
slice-name-table={package="name-table",git="https://github.com/LiGoldragon/name-table.git",rev="50cb4bb53ae2dc4f2516f6912be328ef98ae49f8"}
slice-raw-discovery={package="raw-discovery",git="https://github.com/LiGoldragon/raw-discovery.git",rev="7290f65bbb5e7825ab2ca58340631d154d69d110"}
slice-rust-logos={package="rust-logos",git="https://github.com/LiGoldragon/rust-logos.git",rev="96eda934a8f3203295f0a08869199441f109c369"}
