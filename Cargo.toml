slice-signal-frame={package="signal-frame",git="https://github.com/LiGoldragon/signal-frame.git",rev="0786fbe8caf27552afcdd5deb85bc82ec6088337",default-features=false}
slice-signal-sema-translator={package="signal-sema-translator",git="https://github.com/LiGoldragon/signal-sema-translator.git",rev="51c02c4a7b6f67d9dad095f11986085d7d65785b"}
slice-structural-codec={package="structural-codec",git="https://github.com/LiGoldragon/structural-codec.git",rev="1485c1f8edcb9c988492c6eb0378c10a3599d665"}
[lints.rust]
unsafe_code="forbid"
